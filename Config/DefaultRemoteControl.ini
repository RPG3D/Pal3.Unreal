; UE Remote Control HTTP API — lets an external tool (our ue_remote.py client)
; inspect the running game: actor list, transforms, properties, console commands.
; WebRemoteControl is a RUNTIME module, so this works in "-game", not just PIE.
[/Script/RemoteControlCommon.RemoteControlSettings]
bAutoStartWebServer=True
RemoteControlHttpServerPort=30010
; Local dev machine only: allow arbitrary UFUNCTION calls and console commands.
bAllowAnyRemoteFunctionCall=True
bAllowConsoleCommandRemoteExecution=True
